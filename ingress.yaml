apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calculator-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /calc/
spec:
  rules:
    - host: calculator.local
      http:
        paths:
          - path: /calc/
            pathType: Prefix
            backend:
              service:
                name: calculator-service
                port:
                  number: 8080
